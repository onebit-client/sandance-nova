server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Increase header/cookie buffer sizes to prevent 400 errors
    # when the browser sends large cookies (e.g. accumulated localhost cookies)
    client_header_buffer_size 16k;
    large_client_header_buffers 8 64k;

    # Serve static assets with long-lived cache headers
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback – send all unknown routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
