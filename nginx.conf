server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Increase header/cookie buffer sizes to prevent 400 errors
    # when the browser sends large cookies (e.g. accumulated localhost cookies)
    client_header_buffer_size 16k;
    large_client_header_buffers 8 64k;

    # Redirect /nova to /nova/ for consistency
    location = /nova {
        return 301 /nova/;
    }

    # SPA fallback – handle the /nova subpath
    location /nova/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /nova/index.html;
    }

    # Serve static assets with long-lived cache headers
    location ~* ^/nova/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
    # Optional: Redirect root to /nova/ if nothing else is served
    location / {
        return 301 /nova/;
    }
}
