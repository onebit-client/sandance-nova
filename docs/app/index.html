    <script>
        function setTheme(darkTheme) {
            localStorage.setItem('theme', darkTheme ? 'Dark' : 'Light');
            document.body.classList.toggle('dark-theme', !!darkTheme);
        }
        var darkTheme = localStorage.getItem('theme') === 'Dark';
        document.body.classList.toggle('dark-theme', darkTheme);
        var themeColors = {
            "dark": {
                "backgroundColor": "#0f1625",
                "axisLine": "#31445f",
                "axisText": "#c0cce0",
                "gridLine": "rgba(149, 171, 204, 0.24)",
                "hoveredCube": "#f2f6ff",
                "clickableText": "#9eaefc",
                "clickableTextHighlight": "#c9d3ff",
                "searchText": "#d7e3ff",
                "searchTextHighlight": "#f4f8ff"
            }
        };
        var insights = {
            "titanic": {
                "columns": {
                    "uid": "Name",
                    "x": "Gender",
                    "y": "Joined",
                    "color": "Survived",
                    "z": "TicketCost",
                    "sort": "Survived"
                },
                "scheme": "dual_redgreen",
                "chart": "barchart",
                "view": "2d"
            },
            "demovote": {
                "columns": {
                    "uid": "Id",
                    "x": "Longitude",
                    "y": "Latitude",
                    "color": "Obama",
                    "z": "Education",
                    "sort": "State"
                },
                "scheme": "redblue",
                "chart": "scatterplot",
                "view": "2d",
                "colorBin": "quantize"
            }
        };
        var options = {
            "*": {
                "chartPrefs": {
                    "*": {
                        "*": {
                            "*": {
                                "signalValues": {
                                    "RoleColor_BinCountSignal": 7
                                }
                            }
                        }
                    }
                }
            },
            "titanic": {
                "chartPrefs": {
                    "barchart": {
                        "color": {
                            "Gender": {
                                "scheme": "set2"
                            }
                        }
                    }
                }
            },
            "demovote": {
                "chartPrefs": {
                    "*": {
                        "color": {
                            "Winner": {
                                "scheme": "dual_bluered"
                            }
                        }
                    },
                    "stacks": {
                        "*": {
                            "*": {
                                "signalValues": {
                                    "RoleX_BinsSignal": 30,
                                    "RoleY_BinsSignal": 30
                                }
                            }
                        }
                    }
                },
                "tooltipExclusions": ["Id", "Latitude", "Longitude"]
            }
        };
    </script>
